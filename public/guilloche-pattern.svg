<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" fill="none" stroke="currentColor" stroke-width="0.5">
  <!-- Engraved guilloche rosette tile: interlacing lathe curves, designed for 3-5% opacity use -->
  <g opacity="0.9">
    <!-- concentric rosette rings, quarter-offset for tiling continuity -->
    <circle cx="0" cy="0" r="60" />
    <circle cx="0" cy="0" r="80" />
    <circle cx="0" cy="0" r="100" />
    <circle cx="480" cy="0" r="60" />
    <circle cx="480" cy="0" r="80" />
    <circle cx="480" cy="0" r="100" />
    <circle cx="0" cy="480" r="60" />
    <circle cx="0" cy="480" r="80" />
    <circle cx="0" cy="480" r="100" />
    <circle cx="480" cy="480" r="60" />
    <circle cx="480" cy="480" r="80" />
    <circle cx="480" cy="480" r="100" />
    <circle cx="240" cy="240" r="60" />
    <circle cx="240" cy="240" r="80" />
    <circle cx="240" cy="240" r="100" />
    <circle cx="240" cy="240" r="120" />
    <!-- interlacing sine lathe curves -->
    <path d="M0 120 C 60 90, 120 150, 180 120 S 300 90, 360 120 S 460 150, 480 120" />
    <path d="M0 120 C 60 150, 120 90, 180 120 S 300 150, 360 120 S 460 90, 480 120" />
    <path d="M0 360 C 60 330, 120 390, 180 360 S 300 330, 360 360 S 460 390, 480 360" />
    <path d="M0 360 C 60 390, 120 330, 180 360 S 300 390, 360 360 S 460 330, 480 360" />
    <path d="M120 0 C 90 60, 150 120, 120 180 S 90 300, 120 360 S 150 460, 120 480" />
    <path d="M120 0 C 150 60, 90 120, 120 180 S 150 300, 120 360 S 90 460, 120 480" />
    <path d="M360 0 C 330 60, 390 120, 360 180 S 330 300, 360 360 S 390 460, 360 480" />
    <path d="M360 0 C 390 60, 330 120, 360 180 S 390 300, 360 360 S 330 460, 360 480" />
    <!-- edge mid-point rosettes for seamless joins -->
    <circle cx="240" cy="0" r="40" />
    <circle cx="240" cy="480" r="40" />
    <circle cx="0" cy="240" r="40" />
    <circle cx="480" cy="240" r="40" />
    <!-- fine radial spokes in central rosette -->
    <g>
      <line x1="240" y1="150" x2="240" y2="170" />
      <line x1="240" y1="150" x2="240" y2="170" transform="rotate(30 240 240)" />
      <line x1="240" y1="150" x2="240" y2="170" transform="rotate(60 240 240)" />
      <line x1="240" y1="150" x2="240" y2="170" transform="rotate(90 240 240)" />
      <line x1="240" y1="150" x2="240" y2="170" transform="rotate(120 240 240)" />
      <line x1="240" y1="150" x2="240" y2="170" transform="rotate(150 240 240)" />
      <line x1="240" y1="150" x2="240" y2="170" transform="rotate(180 240 240)" />
      <line x1="240" y1="150" x2="240" y2="170" transform="rotate(210 240 240)" />
      <line x1="240" y1="150" x2="240" y2="170" transform="rotate(240 240 240)" />
      <line x1="240" y1="150" x2="240" y2="170" transform="rotate(270 240 240)" />
      <line x1="240" y1="150" x2="240" y2="170" transform="rotate(300 240 240)" />
      <line x1="240" y1="150" x2="240" y2="170" transform="rotate(330 240 240)" />
    </g>
  </g>
</svg>
